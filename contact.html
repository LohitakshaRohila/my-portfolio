<!DOCTYPE html><html lang="en"><head><title>Contact | Your Name</title><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;700&family=Figtree:wght@400;500;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com/3.4.17"></script><script src="assets/js/tailwind-config.js"></script>
<link rel="stylesheet" href="assets/css/custom.css"></head>
<body class="bg-ink text-slate-200 font-body text-[17px] leading-relaxed antialiased grid-bg">
<div id="site-header"></div>
<main id="top" class="max-w-6xl mx-auto px-6 pt-8">
  <h1 data-scramble class="font-display font-bold text-4xl sm:text-5xl">Let’s talk</h1>
  <p class="text-mut mt-3 max-w-lg">Got a project, a competition team, or a robot that needs a better loop? Send a message.</p>
  <div class="grid md:grid-cols-3 gap-4 mt-8">
    <a data-tilt data-link="github" href="#" class="bg-panel border border-line rounded-xl p-6 hover:border-neon glow-box transition-colors"><b class="block font-display text-xl">GitHub</b><small class="font-mono text-xs text-mut" data-show="github"></small></a>
    <a data-tilt data-link="linkedin" href="#" class="bg-panel border border-line rounded-xl p-6 hover:border-neon glow-box transition-colors"><b class="block font-display text-xl">LinkedIn</b><small class="font-mono text-xs text-mut" data-show="linkedin"></small></a>
    <div data-tilt class="bg-panel border border-line rounded-xl p-6"><b class="block font-display text-xl">Email</b><small class="font-mono text-xs text-mut block" data-show="email"></small>
      <button data-copy-email class="mt-3 font-mono text-xs border border-line rounded px-3 py-1.5 hover:border-neon hover:text-neon">Copy address</button></div>
  </div>
  <form data-reveal id="msg-form" class="mt-10 max-w-xl bg-panel border border-line rounded-xl p-6 space-y-4">
    <h2 class="font-display font-bold text-2xl">Write a message</h2>
    <div><label for="name" class="font-mono text-xs text-mut">Your name</label><input id="name" name="name" required class="w-full mt-1 bg-ink border border-line rounded-md px-3 py-2 focus:border-neon outline-none"></div>
    <div><label for="message" class="font-mono text-xs text-mut">Message</label><textarea id="message" name="message" required rows="4" class="w-full mt-1 bg-ink border border-line rounded-md px-3 py-2 focus:border-neon outline-none"></textarea></div>
    <button class="font-display font-bold px-5 py-3 rounded-md border-[1.5px] border-neon text-neon hover:bg-neon hover:text-ink transition-colors">Open in my email app</button>
  </form>
</main>
<div id="site-footer"></div>
<script src="assets/js/site.js"></script><script src="assets/js/contact.js"></script>
<script src="assets/js/fx.js"></script>
</body></html>
